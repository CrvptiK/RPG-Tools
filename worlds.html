<script>

const plansToggle =
    document.getElementById("plans-toggle");

const plans =
    document.getElementById("plans");


plansToggle.addEventListener("click", function(){

    plans.classList.toggle("open");


    if(plans.classList.contains("open")){

        plansToggle.textContent = "Hide";

    }else{

        plansToggle.textContent = "Show Me Again";

    }

});

const creationToggle =
    document.getElementById("creation-toggle");

const creationMenu =
    document.getElementById("creation-menu");

creationToggle.addEventListener("click", function(event){

    event.preventDefault();

    creationMenu.classList.toggle("open");

    if(creationMenu.classList.contains("open")){

        creationToggle.textContent = "Creation -";

    }else{

        creationToggle.textContent = "Creation +";

        }

});

</script>
