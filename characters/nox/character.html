<main>


<!-- character info -->

<section class="character-header">

    <img
        id="character-portrait"
        class="character-portrait"
        src="images/token_1.PNG"
        alt="Character portrait"
    >


    <div class="character-info">

        <h2 id="character-name">
            Loading...
        </h2>


        <dl>

            <dt>Age</dt>
            <dd id="character-age">
                Loading...
            </dd>


            <dt>Class</dt>
            <dd id="character-class">
                Loading...
            </dd>


            <dt>Lineage</dt>
            <dd id="character-lineage">
                Loading...
            </dd>


            <dt>Concept</dt>
            <dd id="character-concept">
                Loading...
            </dd>

        </dl>


        <div
            class="character-keywords"
            id="character-keywords">
        </div>

    </div>

</section>

<section class="character-section">

    <h2
        class="character-toggle"
        id="gallery-toggle"
    >
        Gallery +
    </h2>

    <div
        class="character-content"
        id="gallery-container"
    >


    </div>

</section>


<!-- baaackstoryy -->

<section class="character-section">

    <h2>Backstory</h2>

    <div id="backstory-container">

      

    </div>

</section>


<!-- relevant side characters aka npcs -->

<section class="character-section">

    <h2>Relevant NPCs</h2>

    <div id="npc-container">

   

    </div>

</section>


<!-- various -->

<section class="character-section">

    <h2>Various</h2>

    <div
        class="misc-list"
        id="misc-container">

    

    </div>

</section>


</main>

<!-- one tutorial later, thank you, youtube -->

<div
    id="gallery-lightbox"
    class="gallery-lightbox"
>

    <button
        id="lightbox-prev"
        class="lightbox-arrow lightbox-prev"
        aria-label="Previous image"
    >
        ‹
    </button>


    <img
        id="lightbox-image"
        src=""
        alt=""
    >

    <video
        id="lightbox-video"
        controls
        playsinline
        preload="metadata">
    </video>


    <button
        id="lightbox-next"
        class="lightbox-arrow lightbox-next"
        aria-label="Next image"
    >
        ›
    </button>


    <button
        id="lightbox-close"
        class="lightbox-close"
        aria-label="Close gallery"
    >
        ×
    </button>

</div>
